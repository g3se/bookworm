{% extends "base.html" %}

{% block content %}
<!-- Book Details Template -->
 <div class="container mt-4 p-4 bg-light" style="border-radius: 8px; box-shadow: 0 3px 5px rgba(0,0,0,0.2);">
<h1>{{ book.title }}</h1>

<p><strong>Title:</strong> {{ book.details.title }}</p>
<p><strong>Author:</strong> {{ book.details.author }}</p>
<p><strong>Price:</strong> ${{ book.price }}</p>
<p><strong>Genre:</strong> {{ book.details.genre }}</p>
<p><strong>Stock:</strong> {{ book.stock }}</p>
<p><strong>Description:</strong> {{ book.details.description_html }}</p>
<img
    src="{{ book.details.cover_url }}"
    alt="{{ book.details.title }}"
    class="img-fluid mb-2"
    style="height: 200px; object-fit: contain;"
><br>

<a href="/books/" class="btn btn-secondary accordion">Back</a>
</div>
{% endblock %}
