<!DOCTYPE html>
<html>
<head><title>Login - Bookworm</title></head>
<body>
  <h2>Login</h2>

  {% if messages %}
    {% for message in messages %}
      <p style="color:red;">{{ message }}</p>
    {% endfor %}
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
  </form>

  <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
</body>
</html>
