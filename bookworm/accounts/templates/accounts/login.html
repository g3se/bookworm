{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login - Bookworm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
      #id_password { margin: 10px; color: #333; padding: 5px;}
      #id_username { margin: 10px; color: #333; padding: 5px;}
    </style>
</head>
<body>
  <div class="container mt-4" 
    style="box-shadow: 0 3px 5px rgba(0,0,0,0.3); 
    background-color: #fff; 
    padding: 30px; 
    border-radius: 8px; 
    max-width: 400px;">
  <h2>Login</h2>

  {% if messages %}
    {% for message in messages %}
      <p style="color:red;">{{ message }}</p>
    {% endfor %}
  {% endif %}
{% comment %} 
  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
  </form> {% endcomment %}
  <div>
  <form method="POST">
    {% csrf_token %}
    <div>
      <label>Username:  </label>
      {{ form.username }}
    </div>
    <div>
    <label>Password: </label>
    {{ form.password }}
    </div>
  </form>
</div>
  <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
  </div>
</body>
</html>
