{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile - Bookworm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'accounts/style.css' %}">
</head>
<body class="login-page">

<nav class="navbar bookworm-navbar">
    <div class="container">
        <a class="navbar-brand" href="/books/">📚 Bookworm Catalog</a>
    </div>
</nav>
<main class="login-content">
<div class="container mt-4 edit-profile-content">
    <h3>✏️ Edit Profile</h3>
    <hr>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-success">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">First Name:</label>
            <input type="text" name="first_name"
                   value="{{ user.first_name }}"
                   class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Last Name:</label>
            <input type="text" name="last_name"
                   value="{{ user.last_name }}"
                   class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Email:</label>
            <input type="email" name="email"
                   value="{{ user.email }}"
                   class="form-control">
        </div>
        <button type="submit" class="btn btn-primary mt-3 login-Button">
            Save Changes
        </button>
    </form>

    <a href="/books/" class="btn btn-outline-secondary mt-3 login-Button">
        Cancel
    </a>
</div>
</main.>
</body>
</html>
