{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>Change Password - Bookworm</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'accounts/style.css' %}">
</head>
<body class="login-page">

  <nav class="navbar bookworm-navbar">
    <div class="container">
      <a class="navbar-brand" href="/books/">🐞📚🐛 Bookworm Catalog</a>
    </div>
  </nav>

  <main class="login-content">
    <div class="container mt-4 edit-profile-content">
      <h3>🔒 Change Password</h3>
      <hr>

      {% if messages %}
        {% for message in messages %}
          <div class="alert 
            {% if 'successfully' in message.tags %}
                alert-success
            {% else %}
                alert-danger
            {% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}

      <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">Current Password:</label>
          {{ form.current_password }}
        </div>

        <div class="mb-3">
          <label class="form-label">New Password:</label>
          {{ form.new_password }}
        </div>

        <div class="mb-3">
          <label class="form-label">Confirm New Password:</label>
          {{ form.confirm_password }}
        </div>

        <button type="submit" class="btn btn-primary mt-3 login-Button">
          Update Password
        </button>
      </form>

      <a href="/books/" class="btn btn-outline-secondary mt-3 login-Button">
        Cancel
      </a>
    </div>
  </main>

</body>
</html>
